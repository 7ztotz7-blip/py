<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>py — รายงานผลการเรียน</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link href="pystart.css" rel="stylesheet" />
<script src="pystart-theme.js"></script>
<script src="pystart-icons.js"></script>
<style>
  body { padding-bottom: 70px; background: var(--bg); }
  
  /* Wrapper for print compatibility */
  .wrap-print { max-width: 860px; margin: 0 auto; padding: 40px 20px; }

  /* Report Header */
  .r-head { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 30px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 30px; box-shadow: var(--shadow-sm); }
  .rh-left { display: flex; gap: 24px; align-items: center; }
  .rh-av { width: 86px; height: 86px; border-radius: 16px; display: grid; place-items: center; font-size: 38px; font-weight: 600; color: #fff; background: linear-gradient(140deg, var(--accent-deep), var(--accent)); box-shadow: 0 1px 0 oklch(1 0 0/.3) inset; }
  .rh-info h1 { font-size: 28px; font-weight: 700; letter-spacing: -.02em; line-height: 1.2; margin-bottom: 6px; color: var(--ink); }
  .rh-info p { font-size: 14.5px; color: var(--muted); margin-bottom: 3px; display:flex; align-items:center; gap:8px; }
  .rh-info .mono { font-family: 'IBM Plex Mono', monospace; }
  .rh-info svg { color: var(--faint); }
  
  .rh-actions { display: flex; gap: 10px; }
  .btn-print { display: inline-flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line); padding: 9px 18px; border-radius: 9px; font-size: 14px; font-weight: 600; color: var(--ink); cursor: pointer; transition: .15s; box-shadow: var(--shadow-sm); }
  .btn-print:hover { background: var(--soft); border-color: var(--line-deep); }

  /* Stat Summary */
  .r-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 30px; }
  .r-stat { background: var(--card); border: 1px solid var(--line); padding: 22px 26px; border-radius: 14px; box-shadow: var(--shadow-sm); }
  .r-stat .sl { font-size: 12.5px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 10px; display:flex; align-items:center; gap:8px;}
  .r-stat .sl svg { color: var(--accent); }
  .r-stat .sn { font-size: 32px; font-weight: 700; font-family: 'IBM Plex Mono', monospace; letter-spacing: -.02em; color: var(--ink); }
  .r-stat .sn span { font-size: 15px; color: var(--faint); font-weight: 500; font-family: 'IBM Plex Sans Thai', sans-serif; letter-spacing: 0; }

  /* Report Table */
  .stitle { display: flex; align-items: center; gap: 11px; margin-bottom: 16px; margin-top:40px; }
  .stitle h2 { font-size: 20px; font-weight: 600; letter-spacing: -.01em; color: var(--ink); }
  .stitle .ct { margin-left: auto; font-family: 'IBM Plex Mono', monospace; font-size: 13.5px; color: var(--faint); }
  
  .r-table-wrap { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow-sm); }
  .r-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14.5px; }
  .r-table th { background: var(--soft); padding: 14px 20px; font-weight: 600; font-size: 13.5px; color: var(--muted); border-bottom: 1px solid var(--line); }
  .r-table td { padding: 16px 20px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
  .r-table tr:last-child td { border-bottom: none; }
  .r-table tbody tr:hover { background: oklch(0.99 0.003 250); }
  
  .rt-num { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; color: var(--faint); font-weight: 600; width: 50px; }
  .rt-name { font-weight: 600; color: var(--ink); }
  .rt-name small { display: block; font-weight: 400; color: var(--muted); font-size: 13px; margin-top: 2px; }
  .rt-score { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 14.5px; }
  .rt-null { color: var(--faint); font-weight: 400; font-family: inherit; }
  
  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 6px; font-size: 12.5px; font-weight: 600; border: 1px solid transparent; }
  .b-pass { background: var(--ok-soft); color: var(--ok-deep); border-color: var(--ok-line); }
  .b-wait { background: var(--warm-soft); color: var(--warm-deep); border-color: var(--warm-line); }
  .b-lock { background: var(--soft); color: var(--muted); border-color: var(--line); }

  @media (max-width: 768px) {
    .r-head { flex-direction: column; align-items: stretch; gap: 20px; }
    .rh-actions { justify-content: flex-start; }
    .r-summary { grid-template-columns: 1fr; }
    .rt-pre { display: none; } /* Hide pre-test on mobile to save space */
  }

  /* Print Styles */
  @media print {
    body { background: #fff; padding: 0; }
    .topbar, .btn-print, .tb-menu-btn { display: none !important; }
    .wrap-print { padding: 0; max-width: 100%; margin: 0; }
    .r-head, .r-stat, .r-table-wrap { box-shadow: none; border: 1px solid #ccc; break-inside: avoid; }
    .r-table th { background: #f9f9f9; color: #333; }
    .b-pass, .b-wait, .b-lock { border: 1px solid #999; background: transparent !important; color: #000 !important; }
  }
</style>
</head>
<body>

<header class="topbar">
  <a class="tb-logo" href="index.html" aria-label="py"><span class="tb-mk"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m7 6 6 6-6 6M15 18h4" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span></a>
  <button class="tb-menu-btn" id="tbMenuBtn" type="button" aria-label="เมนู" aria-expanded="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
  <nav class="tb-nav">
    <a href="courses.html">หลักสูตร</a>
    <a href="reference.html">คู่มือ Python</a>

    <a href="profile.html" class="cur">รายงานผล</a>
  </nav>
  <div class="tb-right">
    <a class="tb-settings-icon" href="settings.html" aria-label="ตั้งค่า" title="ตั้งค่า"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7ZM19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.12 2.12-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.04 1.56v.08h-3v-.08a1.7 1.7 0 0 0-1.04-1.56 1.7 1.7 0 0 0-1.88.34l-.06.06-2.12-2.12.06-.06A1.7 1.7 0 0 0 7 15a1.7 1.7 0 0 0-1.56-1.04h-.08v-3h.08A1.7 1.7 0 0 0 7 9.92a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.12-2.12.06.06a1.7 1.7 0 0 0 1.88.34 1.7 1.7 0 0 0 1.04-1.56V4.6h3v.1a1.7 1.7 0 0 0 1.04 1.56 1.7 1.7 0 0 0 1.88-.34l.06-.06 2.12 2.12-.06.06a1.7 1.7 0 0 0-.34 1.88 1.7 1.7 0 0 0 1.56 1.04h.08v3h-.08A1.7 1.7 0 0 0 19.4 15Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></a>
    <span class="chiplet" style="color:var(--accent-deep)" id="xpChiplet"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 19V9m5 10V5m5 14v-7m5 7V3" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/></svg> 0%</span>
    <button class="btn btn-ghost sm tb-compact" id="signOutBtn" type="button" title="ออกจากระบบ">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      <span class="tb-compact-tx">ออกจากระบบ</span>
    </button>
    <a class="tb-av" href="profile.html" id="tbAvatar">?</a>
  </div>
</header>

<div class="wrap-print">
  
  <!-- HEADER -->
  <section class="r-head">
    <div class="rh-left">
      <div class="rh-av" id="profAvatar">?</div>
      <div class="rh-info">
        <h1 id="profName">กำลังโหลด...</h1>
        <p><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg> <span class="mono" id="profEmail">กำลังโหลด...</span></p>
        <p><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg> <span id="profJoined">—</span></p>
      </div>
    </div>
    <div class="rh-actions">
      <button class="btn-print" onclick="window.print()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
        พิมพ์รายงาน
      </button>
    </div>
  </section>

  <!-- STAT STRIP -->
  <div class="r-summary">
    <div class="r-stat">
      <div class="sl"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V9m5 10V5m5 14v-7m5 7V3"></path></svg> ความคืบหน้าหลักสูตร</div>
      <div class="sn" id="statPct">0<span>%</span></div>
    </div>
    <div class="r-stat">
      <div class="sl"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg> บทเรียนที่สำเร็จ</div>
      <div class="sn" id="statLessons">0<span> / 29</span></div>
    </div>
    <div class="r-stat">
      <div class="sl"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v-6M6 20V10M18 20V4"></path></svg> คะแนนเฉลี่ย (Post-test)</div>
      <div class="sn" id="statAvg">0<span>%</span></div>
    </div>
  </div>

  <!-- SCORE BREAKDOWN TABLE -->
  <div class="stitle">
    <h2>รายงานผลการทดสอบแยกตามหน่วย (Score Breakdown)</h2>
    <span class="ct" id="breakdownCt">0 หน่วย</span>
  </div>
  <div class="r-table-wrap">
    <table class="r-table">
      <thead>
        <tr>
          <th width="80">หน่วยที่</th>
          <th>ชื่อหน่วยการเรียนรู้</th>
          <th class="rt-pre" width="140">คะแนนก่อนเรียน</th>
          <th width="140">คะแนนหลังเรียน</th>
          <th width="120">สถานะ</th>
        </tr>
      </thead>
      <tbody id="breakdownTable">
        <!-- JS generates rows here -->
      </tbody>
    </table>
  </div>
</div>

<script src="pystart-data.js"></script>

    await signOut(auth);
    location.href='index.html';
  });

  if(!user) throw new Error('redirecting to login'); // requireUser() already navigated away

  const profileDoc = await loadProfile(user.uid);

  const initial = displayName.trim().charAt(0).toUpperCase() || '?';

  document.getElementById('tbAvatar').textContent = initial;
  document.getElementById('profName').textContent = displayName;
  document.getElementById('profEmail').textContent = user.email;
  const joined = user.metadata && user.metadata.creationTime ? new Date(user.metadata.creationTime) : null;
  document.getElementById('profJoined').textContent = joined
    ? ('เริ่มต้นเรียนเมื่อ '+joined.toLocaleDateString('th-TH',{year:'numeric',month:'long',day:'numeric'}))
    : 'เริ่มต้นเรียนแล้ว';

  document.getElementById('statLessons').innerHTML = completed.length+'<span> / '+totalLessons+' บท</span>';

    const us = unitScores[u.id];
    const pre = us && us.pre;
    const post = us && us.post;
    
    let preHtml = pre ? '<span class="rt-score">'+pre.score+'/'+pre.total+'</span>' : '<span class="rt-null">—</span>';
    let postHtml = post ? '<span class="rt-score">'+post.score+'/'+post.total+'</span>' : '<span class="rt-null">—</span>';
    
    let statusHtml = '<span class="badge b-lock">ยังไม่เริ่มเรียน</span>';
    if(post && post.pct >= 70) {
      statusHtml = '<span class="badge b-pass">ผ่านเกณฑ์ ('+post.pct+'%)</span>';
      sumPostPct += post.pct;
      countPost++;
    } else if(post) {

      sumPostPct += post.pct;
      countPost++;
    } else if(pre) {
      statusHtml = '<span class="badge b-wait">รอสอบหลังเรียน</span>';
    }

    return '<tr>'+
      '<td class="rt-num">'+String(u.id).padStart(2,'0')+'</td>'+
      '<td class="rt-name">'+u.title+'</td>'+
      '<td class="rt-pre">'+preHtml+'</td>'+
      '<td>'+postHtml+'</td>'+
      '<td>'+statusHtml+'</td>'+
    '</tr>';
  }).join('');

  const avgScore = countPost > 0 ? Math.round(sumPostPct / countPost) : 0;
  document.getElementById('statAvg').innerHTML = avgScore+'<span>%</span>';

</script>
