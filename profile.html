<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>py — โปรไฟล์ & ความสำเร็จ</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link href="pystart.css" rel="stylesheet" />
<style>
  body{padding-bottom:70px;}

  /* profile header */
  .phead{position:relative;overflow:hidden;margin-top:30px;border-radius:24px;padding:38px 40px;color:#fff;
    background:
      radial-gradient(600px 300px at 88% -20%,oklch(0.64 0.16 278/.55),transparent 64%),
      radial-gradient(500px 360px at 6% 120%,oklch(0.58 0.15 200/.45),transparent 60%),
      linear-gradient(150deg,oklch(0.4 0.13 290),oklch(0.3 0.1 294));
    box-shadow:var(--shadow-lg);}
  .phead::after{content:"";position:absolute;inset:0;opacity:.4;pointer-events:none;
    background-image:radial-gradient(circle at 1px 1px,oklch(1 0 0/.1) 1px,transparent 0);background-size:24px 24px;}
  .ph-row{position:relative;z-index:2;display:flex;align-items:center;gap:24px;flex-wrap:wrap;}
  .ph-av{width:96px;height:96px;border-radius:28px;flex-shrink:0;display:grid;place-items:center;font-size:40px;font-weight:600;color:#fff;
    background:linear-gradient(140deg,oklch(0.72 0.13 30),oklch(0.55 0.16 12));box-shadow:0 1px 0 oklch(1 0 0/.4) inset,0 16px 30px -10px oklch(0 0 0/.5);border:2px solid oklch(1 0 0/.2);}
  .ph-id{flex:1;min-width:200px;}
  .ph-id h1{font-size:30px;font-weight:600;letter-spacing:-.02em;}
  .ph-id .handle{color:oklch(0.88 0.03 250);font-size:15px;margin-top:4px;font-family:'IBM Plex Mono',monospace;}
  .ph-id .joined{color:oklch(0.82 0.03 250);font-size:13.5px;margin-top:10px;display:inline-flex;align-items:center;gap:7px;}
  .ph-level{position:relative;z-index:2;text-align:center;background:oklch(1 0 0/.1);border:1px solid oklch(1 0 0/.2);border-radius:18px;padding:18px 26px;backdrop-filter:blur(8px);}
  .ph-level .lv{font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:1;}
  .ph-level .ll{font-size:12.5px;color:oklch(0.88 0.03 250);margin-top:5px;letter-spacing:.05em;text-transform:uppercase;}
  .ph-level .lbar{width:120px;height:6px;border-radius:100px;background:oklch(1 0 0/.2);overflow:hidden;margin-top:11px;}
  .ph-level .lbar i{display:block;height:100%;width:62%;background:linear-gradient(90deg,oklch(0.85 0.1 200),#fff);border-radius:100px;}
  .ph-level .lx{font-size:11px;color:oklch(0.85 0.03 250);margin-top:7px;font-family:'IBM Plex Mono',monospace;}

  /* stat strip */
  .strip{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:22px;}
  .sc{background:linear-gradient(180deg,#fff,var(--soft));border:1px solid var(--line);border-radius:17px;padding:20px;box-shadow:var(--shadow-sm);
    transition:transform .18s,box-shadow .18s,border-color .18s;}
  .sc:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--accent-line);}
  .sc .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:19px;margin-bottom:13px;
    box-shadow:0 1px 0 oklch(1 0 0/.4) inset,var(--shadow-sm);}
  .sc .n{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1;}
  .sc .l{font-size:13px;color:var(--muted);margin-top:6px;}

  @media (max-width:900px){.strip{grid-template-columns:1fr 1fr;}}

  /* score breakdown */
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 26px;box-shadow:var(--shadow-md);}
  .mrow{display:flex;align-items:center;gap:16px;padding:13px 0;}
  .mrow + .mrow{border-top:1px solid var(--line-soft);}
  .mrow .mi{width:38px;height:38px;border-radius:11px;flex-shrink:0;display:grid;place-items:center;font-family:'IBM Plex Mono',monospace;
    font-weight:600;font-size:15px;background:var(--accent-soft);color:var(--accent-deep);}
  .mrow .mi.mi-lock{background:var(--soft);color:var(--faint);}
  .mrow .mname{width:190px;flex-shrink:0;font-size:14.5px;font-weight:500;}
  .mrow .mname small{display:block;color:var(--faint);font-weight:400;font-size:12.5px;margin-top:1px;}
  .mrow .mbar{flex:1;height:11px;border-radius:100px;background:var(--soft);border:1px solid var(--line);overflow:hidden;}
  .mrow .mbar i{display:block;height:100%;border-radius:100px;transition:width 1s cubic-bezier(.2,.7,.2,1);}
  .mrow .mscore{width:60px;text-align:right;flex-shrink:0;font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;}
  .lv-hi{background:linear-gradient(90deg,var(--ok),var(--ok-deep));} .c-hi{color:var(--ok-deep);}
  .lv-md{background:linear-gradient(90deg,var(--accent),var(--accent-2));} .c-md{color:var(--accent-deep);}
  .lv-lo{background:linear-gradient(90deg,var(--warm),var(--warm-deep));} .c-lo{color:var(--warm-deep);}
  .lv-empty{background:none;} .c-empty{color:var(--faint);}
  .mrow-empty .mname{color:var(--faint);}
  @media (max-width:640px){.mrow .mname{width:120px;}}

  /* achievements */
  .section{margin-top:34px;}
  .stitle{display:flex;align-items:center;gap:11px;margin-bottom:16px;}
  .stitle h2{font-size:20px;font-weight:600;letter-spacing:-.01em;}
  .stitle .si{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#fff;font-size:15px;
    background:linear-gradient(140deg,var(--gold),var(--gold-deep));}
  .stitle .ct{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--faint);}
  .ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;}
  .ach{display:flex;align-items:center;gap:14px;background:linear-gradient(180deg,#fff,var(--soft));border:1px solid var(--line);
    border-radius:16px;padding:16px 18px;box-shadow:var(--shadow-sm);text-decoration:none;color:inherit;transition:transform .18s,box-shadow .18s,border-color .18s;}
  .ach.unlocked:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--accent-line);}
  .ach.locked{background:var(--soft);opacity:.55;}
  .ach-badge{width:44px;height:44px;border-radius:13px;flex-shrink:0;display:grid;place-items:center;font-size:20px;
    background:linear-gradient(140deg,var(--accent-2),var(--accent-deep));
    box-shadow:0 1px 0 oklch(1 0 0/.4) inset,0 0 0 3px var(--accent-soft),0 8px 16px -6px oklch(0.45 0.13 288/.5);}
  .ach.locked .ach-badge{background:linear-gradient(140deg,oklch(0.82 0.01 255),oklch(0.72 0.012 255));box-shadow:var(--shadow-sm);filter:grayscale(1);}
  .ach.gold .ach-badge{background:linear-gradient(140deg,var(--gold),var(--gold-deep));
    box-shadow:0 1px 0 oklch(1 0 0/.4) inset,0 0 0 3px oklch(0.9 0.06 85/.5),0 8px 16px -6px oklch(0.6 0.12 80/.55);}
  .ach-info{min-width:0;}
  .ach-name{font-size:14.5px;font-weight:600;letter-spacing:-.005em;}
  .ach-desc{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .ach.locked .ach-desc{color:var(--faint);}
</style>
</head>
<body data-fx=".topbar, .phead, .strip > .sc" data-fx-count=".strip .sc .n, .ph-level .lv">
<script>
(function(){var b=document.body,s=b.getAttribute('data-fx');if(!s)return;document.documentElement.classList.add('js-fx');if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;var st=document.createElement('style');st.textContent='.js-fx :is('+s+'){transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1)}.js-fx :is('+s+'):not(.fx-shown){opacity:0;transform:translateY(22px)}';document.head.appendChild(st);})();
</script>

<header class="topbar">
  <a class="tb-logo" href="index.html"><span class="tb-mk">py</span></a>
  <button class="tb-menu-btn" id="tbMenuBtn" type="button" aria-label="เมนู" aria-expanded="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
  <nav class="tb-nav">
    <a href="courses.html">หลักสูตร</a>
    <a href="dashboard.html">แดชบอร์ด</a>
    <a href="profile.html" class="cur">โปรไฟล์</a>
  </nav>
  <div class="tb-right">
    <span class="chiplet" style="color:var(--accent-deep)" id="xpChiplet">📊 0%</span>
    <button class="btn btn-ghost sm tb-compact" id="signOutBtn" type="button" title="ออกจากระบบ">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      <span class="tb-compact-tx">ออกจากระบบ</span>
    </button>
    <a class="tb-av" href="profile.html" id="tbAvatar">?</a>
  </div>
</header>

<div class="wrap">
  <!-- HEADER -->
  <section class="phead">
    <div class="ph-row">
      <div class="ph-av" id="profAvatar">?</div>
      <div class="ph-id">
        <h1 id="profName">กำลังโหลด...</h1>
        <div class="handle" id="profHandle"></div>
        <div class="joined"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg><span id="profJoined">—</span></div>
      </div>
      <div class="ph-level">
        <div class="lv" id="profLevel">0%</div>
        <div class="ll">ความคืบหน้ารวม</div>
        <div class="lbar"><i id="profLevelBar"></i></div>
        <div class="lx" id="profXpLabel">0 / 29 บท</div>
      </div>
    </div>
  </section>

  <!-- STAT STRIP -->
  <div class="strip">
    <div class="sc"><div class="ic" style="background:var(--accent-soft);color:var(--accent-deep)">📖</div><div class="n" id="statLessons">0</div><div class="l">บทที่เรียนจบ</div></div>
    <div class="sc"><div class="ic" style="background:var(--ok-soft);color:var(--ok-deep)">✅</div><div class="n" id="statTests">0</div><div class="l">แบบฝึกหัดที่ทำผ่าน</div></div>
  </div>

  <!-- SCORE BREAKDOWN -->
  <section class="section">
    <div class="stitle">
      <div class="si">📊</div>
      <h2>คะแนนแยกตามหน่วย</h2>
      <span class="ct" id="breakdownCt">0 หน่วย</span>
    </div>
    <div class="card" id="breakdown"></div>
  </section>

  <!-- ACHIEVEMENTS -->
  <section class="section">
    <div class="stitle">
      <div class="si">🏆</div>
      <h2>ความสำเร็จ</h2>
      <span class="ct" id="achCount">0/0 ปลดล็อก</span>
    </div>
    <div class="ach-grid" id="achGrid"></div>
  </section>
</div>

<script src="pystart-data.js"></script>
<script type="module">
  import { auth } from './assets/js/firebase.js';
  import { signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { requireUser, loadProgress, loadProfile } from './assets/js/progress-store.js';

  document.getElementById('signOutBtn').addEventListener('click', async ()=>{
    await signOut(auth);
    location.href='index.html';
  });

  const user = await requireUser();
  if(!user) throw new Error('redirecting to login'); // requireUser() already navigated away

  // the signup form saves the chosen name to Firestore directly — read it
  // from there rather than the Auth profile field, which can lag behind
  // right after signup.
  const profileDoc = await loadProfile(user.uid);
  const displayName = profileDoc.name || user.displayName || user.email.split('@')[0];
  const initial = displayName.trim().charAt(0).toUpperCase() || '?';
  document.getElementById('profAvatar').textContent = initial;
  document.getElementById('tbAvatar').textContent = initial;
  document.getElementById('profName').textContent = displayName;
  document.getElementById('profHandle').textContent = '@'+user.email.split('@')[0]+' · ผู้เรียนมือใหม่';
  const joined = user.metadata && user.metadata.creationTime ? new Date(user.metadata.creationTime) : null;
  document.getElementById('profJoined').textContent = joined
    ? ('เข้าร่วมเมื่อ '+joined.toLocaleDateString('th-TH',{year:'numeric',month:'long'}))
    : 'เข้าร่วมแล้ว';

  const { completed, unitScores, finalExam } = await loadProgress(user.uid);
  const totalLessons = courseData.lessons.length;
  // "passed" means the post-test cleared the 70% bar, same rule that
  // unlocks the next unit (see pyIsUnitPostPassed) — pre-tests are just a
  // diagnostic baseline and have no pass/fail of their own, so they don't
  // count here even though they're stored in unitScores too.
  const testsPassed = Object.values(unitScores).reduce((n,u)=>n+((u.post && u.post.pct>=70)?1:0),0);
  document.getElementById('statLessons').textContent = completed.length;
  document.getElementById('statTests').textContent = testsPassed;
  const overallPct = Math.round((completed.length/totalLessons)*100);
  document.getElementById('xpChiplet').textContent = '📊 '+overallPct+'%';
  document.getElementById('profLevel').textContent = overallPct+'%';
  document.getElementById('profXpLabel').textContent = completed.length+' / '+totalLessons+' บท';
  const levelBar=document.getElementById('profLevelBar');
  levelBar.style.width='0';
  requestAnimationFrame(()=>{levelBar.style.transition='width 1s cubic-bezier(.2,.7,.2,1)';levelBar.style.width=overallPct+'%';});

  // ---------- score breakdown ----------
  // Post-test result per unit, same source of truth as results.html's
  // breakdown — but unlike that page (which only renders once every unit
  // is done), a unit here can still be untouched or only pre-tested, so
  // each row has to degrade gracefully instead of assuming .post exists.
  document.getElementById('breakdownCt').textContent = courseUnits.length+' หน่วย';
  document.getElementById('breakdown').innerHTML = courseUnits.map(function(u){
    const us = unitScores[u.id];
    const post = us && us.post;
    if(post){
      const lv = post.pct>=90?'lv-hi':(post.pct>=70?'lv-md':'lv-lo');
      const c = post.pct>=90?'c-hi':(post.pct>=70?'c-md':'c-lo');
      return '<div class="mrow"><span class="mi">'+u.id+'</span><span class="mname">'+u.title+'<small>'+post.total+' ข้อ</small></span>'+
        '<span class="mbar"><i class="'+lv+'" data-w="'+post.pct+'"></i></span><span class="mscore '+c+'">'+post.score+'/'+post.total+'</span></div>';
    }
    const label = us && us.pre ? 'รอทำแบบทดสอบหลังเรียน' : 'ยังไม่เริ่มเรียน';
    return '<div class="mrow mrow-empty"><span class="mi mi-lock">'+u.id+'</span><span class="mname">'+u.title+'<small>'+label+'</small></span>'+
      '<span class="mbar"><i class="lv-empty" data-w="0"></i></span><span class="mscore c-empty">—</span></div>';
  }).join('');
  requestAnimationFrame(()=>{
    document.querySelectorAll('#breakdown .mbar i').forEach(function(el){
      el.style.width='0';
      requestAnimationFrame(()=>{ el.style.width=el.dataset.w+'%'; });
    });
  });

  // ---------- achievements ----------
  // Every badge below is derived from data already tracked in Firestore
  // (completed lessons, per-unit pre/post scores, final exam) — nothing
  // fabricated like a login streak, since that isn't tracked anywhere yet.
  const perfectUnit = Object.values(unitScores).some(function(u){
    return (u.pre && u.pre.pct === 100) || (u.post && u.post.pct === 100);
  });
  const halfwayLessons = Math.round(totalLessons/2);
  const achievements = [
    { icon:'🚀', name:'ก้าวแรก', desc:'เรียนจบบทแรก', unlocked: completed.length >= 1 },
    { icon:'⚡', name:'ครึ่งทางแล้ว', desc:'เรียนจบ '+halfwayLessons+' จาก '+totalLessons+' บท', unlocked: completed.length >= halfwayLessons },
    { icon:'📚', name:'เรียนจบทุกบท', desc:'ครบทั้ง '+totalLessons+' บทเรียน', unlocked: completed.length >= totalLessons },
    { icon:'💯', name:'มือฉมัง', desc:'ทำแบบทดสอบได้เต็ม 100%', unlocked: perfectUnit }
  ].concat(courseUnits.map(function(u){
    return { icon:String(u.id), name:'จบส่วนที่ '+u.id, desc:u.title, unlocked: pyIsUnitPostPassed(unitScores, u.id) };
  })).concat([
    { icon:'🏅', name:'ใบประกาศ', desc:'สอบปลายทางผ่านเกณฑ์', unlocked: pyIsFinalExamPassed(finalExam), gold:true, href:'results.html' }
  ]);

  const unlockedCount = achievements.filter(function(a){ return a.unlocked; }).length;
  document.getElementById('achCount').textContent = unlockedCount+'/'+achievements.length+' ปลดล็อก';
  document.getElementById('achGrid').innerHTML = achievements.map(function(a){
    const tag = a.unlocked && a.href ? 'a' : 'div';
    const hrefAttr = a.unlocked && a.href ? ' href="'+a.href+'"' : '';
    return '<'+tag+hrefAttr+' class="ach '+(a.unlocked?'unlocked':'locked')+(a.gold?' gold':'')+'">'+
      '<div class="ach-badge">'+(a.unlocked?a.icon:'🔒')+'</div>'+
      '<div class="ach-info"><div class="ach-name">'+a.name+'</div><div class="ach-desc">'+a.desc+'</div></div>'+
      '</'+tag+'>';
  }).join('');
</script>
<script src="pystart-fx.js"></script>
</body>
</html>
