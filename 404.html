<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>py — ไม่พบหน้านี้</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link href="pystart.css" rel="stylesheet" />
<script src="pystart-theme.js"></script>
<style>
  body{min-height:100vh;display:flex;flex-direction:column;}
  .nf-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 24px;text-align:center;}
  .nf-card{max-width:480px;}
  .nf-code{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:clamp(64px,14vw,96px);line-height:1;
    letter-spacing:-.02em;background:linear-gradient(120deg,var(--accent),var(--accent-2));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  .nf-icon{width:72px;height:72px;border-radius:20px;margin:0 auto 22px;display:grid;place-items:center;color:#fff;
    background:linear-gradient(140deg,var(--accent-2),var(--accent-deep));
    box-shadow:0 1px 0 oklch(1 0 0/.4) inset,0 16px 32px -12px oklch(0.45 0.14 288/.55);}
  .nf-title{font-size:22px;font-weight:600;letter-spacing:-.01em;margin-top:18px;}
  .nf-sub{color:var(--muted);font-size:15.5px;line-height:1.6;margin-top:10px;}
  .nf-actions{display:flex;gap:12px;justify-content:center;margin-top:30px;flex-wrap:wrap;}
  .nf-code-window{margin:30px auto 0;max-width:340px;border-radius:14px;overflow:hidden;text-align:left;
    border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow-sm);}
  .nf-cw-bar{display:flex;align-items:center;gap:6px;padding:9px 14px;background:var(--soft);border-bottom:1px solid var(--line);}
  .nf-cw-bar i{width:9px;height:9px;border-radius:50%;}
  .nf-cw-bar span{margin-left:8px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--faint);}
  .nf-cw-body{padding:16px 18px;font-family:'IBM Plex Mono',monospace;font-size:13px;line-height:1.85;}
  .nf-cw-body .c{color:oklch(0.6 0.03 165);} .nf-cw-body .k{color:oklch(0.52 0.15 300);} .nf-cw-body .f{color:var(--accent);} .nf-cw-body .s{color:oklch(0.55 0.12 28);}
</style>
</head>
<body>

<header class="topbar">
  <a class="tb-logo" href="index.html"><span class="tb-mk">py</span></a>
</header>

<main class="nf-wrap">
  <div class="nf-card">
    <div class="nf-icon">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
    </div>
    <div class="nf-code">404</div>
    <h1 class="nf-title">ไม่พบหน้านี้</h1>
    <p class="nf-sub">ลิงก์นี้อาจพิมพ์ผิด ถูกย้าย หรือไม่มีอยู่จริง — ลองกลับไปเริ่มจากหน้าแรกหรือหน้าหลักสูตรแทน</p>
    <div class="nf-actions">
      <a class="btn btn-primary" href="index.html">กลับหน้าแรก</a>
      <a class="btn btn-ghost" href="courses.html">ไปหน้าหลักสูตร</a>
    </div>

    <div class="nf-code-window">
      <div class="nf-cw-bar">
        <i style="background:oklch(0.72 0.16 25)"></i><i style="background:oklch(0.84 0.13 90)"></i><i style="background:oklch(0.76 0.14 150)"></i>
        <span>find_page.py</span>
      </div>
      <div class="nf-cw-body"><span class="c"># ค้นหาหน้าที่ขอไว้</span><br/><span class="k">try</span>:<br/>&nbsp;&nbsp;&nbsp;&nbsp;<span class="f">open</span>(<span class="s">"หน้านี้"</span>)<br/><span class="k">except</span> FileNotFoundError:<br/>&nbsp;&nbsp;&nbsp;&nbsp;<span class="f">print</span>(<span class="s">"ไม่เจอ 404"</span>)</div>
    </div>
  </div>
</main>

</body>
</html>
